name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    env:
      GKSwstype: "100"

    steps:
      - name: Checkout TV_Denoising
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout TVDenoise.jl comparison package
        uses: actions/checkout@v4
        with:
          repository: nikopj/TVDenoise.jl
          path: TVDenoise.jl

      - name: Checkout ProxTV.jl reference package
        uses: actions/checkout@v4
        with:
          repository: XiaochuanLyu/ProxTV.jl
          ref: HL/Bug-Fix-1
          path: ProxTV.jl

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts and packages
        uses: julia-actions/cache@v2

      - name: Instantiate docs environment
        run: |
          sed -i '/^ProxTV = /d; /^TVDenoise = /d' docs/Project.toml
          julia --project=docs -e '
            import Pkg
            Pkg.develop([
              Pkg.PackageSpec(path="ProxTV.jl"),
              Pkg.PackageSpec(path="TVDenoise.jl"),
            ])
            Pkg.instantiate()
            Pkg.status()
          '

      - name: Smoke test docs dependencies
        run: |
          julia --project=docs -e '
            using LinearAlgebra
            using ProxTV
            using TVDenoise
            y = randn(16)
            h = NormTVp(0.1, 1.0, length(y))
            xp = similar(y, Float64)
            prox!(xp, h, y, 1.0)
            x, hist = tvd(y, 0.1, 5.0; maxit=1000, tol=1e-8, verbose=false)
            @assert length(xp) == length(y)
            @assert length(x) == length(y)
            @assert hist.k > 0
            println("ProxTV and TVDenoise smoke tests passed; TVDenoise iterations = ", hist.k)
          '

      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
